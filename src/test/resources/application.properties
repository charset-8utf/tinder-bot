spring.profiles.active=test

telegram.bot.name=test
telegram.bot.token=test
openai.token=test
openai.api-host=https://api.openai.com/
telegram.bot.register=false

spring.main.banner-mode=off
spring.jmx.enabled=false

spring.datasource.url=jdbc:h2:mem:tinderbot;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false