name: tinderbot

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tinderbot}
      POSTGRES_USER: ${POSTGRES_USER:-tinderbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tinderbot}
    ports:
      # 5433 по умолчанию: на многих машинах 5432 уже занят локальным PostgreSQL
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - tinderbot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tinderbot} -d ${POSTGRES_DB:-tinderbot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/charset-8utf/tinder-bot:${TINDERBOT_TAG:-latest}
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      TELEGRAM_BOT_NAME: ${TELEGRAM_BOT_NAME:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      OPENAI_TOKEN: ${OPENAI_TOKEN:-}
      OPENAI_API_HOST: ${OPENAI_API_HOST:-https://api.openai.com/}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-3.5-turbo}
      OPENAI_MAX_TOKENS: ${OPENAI_MAX_TOKENS:-8192}
      OPENAI_READ_TIMEOUT_SECONDS: ${OPENAI_READ_TIMEOUT_SECONDS:-1200}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-tinderbot}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-tinderbot}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-tinderbot}
      TELEGRAM_BOT_REGISTER: ${TELEGRAM_BOT_REGISTER:-true}
      API_SECURITY_ENABLED: ${API_SECURITY_ENABLED:-true}
      JWT_SECRET: ${JWT_SECRET:-demo-only-jwt-secret-change-me-in-real-projects-32-plus-chars}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}

volumes:
  tinderbot_pgdata:
